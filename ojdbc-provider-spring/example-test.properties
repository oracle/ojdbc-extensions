# This file provides examples of properties that configure tests in this
# module.
#
# QUICK GUIDE TO RUNNING TESTS:
#   1. Create a copy of this file named "test.properties":
#      cp example-test.properties test.properties
#   2. In test.properties, replace example values with real values (the file is
#      .gitignore'd, so sensitive info won't be checked in to the repo)
#   3. Comment out any lines for which a value can not be provided (tests are
#      skipped if no value is configured).
#   4. mvn clean verify
#
# CONFIGURING TEST PROPERTIES
#   Test properties are read from a properties file by the TestProperties class.
#   The TestProperties class can be found in:
#   ojdbc-provider-common/src/testFixtures/java/oracle/jdbc/provider/TestProperties.java
#   The default behavior of TestProperties is to read a file named
#   "test.properties" in the current directory. A non-default location may be
#   specified as a JVM system property:
#   mvn clean verify -Doracle.jdbc.provider.TestProperties=/path/to/my-test.properties
#
# MAINTAINING THIS FILE
#   Project maintainers should add an example to this file anytime they write a
#   test which requires a new property. Not doing so will inflict pain and
#   suffering upon our fellow programmers, and will also lead to increased
#   maintenance costs.
#
# IGNORING UNCONFIGURED PROPERTIES
#   No test should cause a build failure due to an unconfigured property.
#   Using JUnit terminology: A test should "abort" rather than "fail" when a
#   property is not configured. This means that the test does not pass, but it
#   does not cause the build to fail either.
#   Methods of the TestProperties class will automatically abort a test if a
#   property is not configured. The org.junit.jupiter.api.Assumptions class may
#   also be used directly to abort a test.
#   There is NO environment in which ALL tests can be run. Some tests may
#   require authentication as a managed identity in an Azure VM, while other
#   tests require authentication as an instance principal in an OCI compute
#   instance; These environments are mutually exclusive. This is one reason why
#   tests can not fail the build if a required property is not set.
#   A more practical reason is that developers may not need to run all tests if
#   their changes are isolated to single module. For instance, a developer
#   working on an OCI provider should not need to set up an Azure tenancy to test
#   their changes.


# Authorization end point of an Azure tenant that issues access tokens.
AZURE_TOKEN_URI=https://login.microsoftonline.com/{TENANT_ID}/oauth2/v2.0/token

# The scope that the application identified by AZURE_CLIENT_ID is authorized to
# access. This scope would typically identify an application associated to an
# Oracle Database, but for this test suite, it can be any application.
AZURE_SCOPE=https://tenant.host.com/cccccccc-cccc-cccc-cccc-cccccccccccc/.default

# The client ID of an Azure application
AZURE_CLIENT_ID=bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb

# The client secret of an Azure application
AZURE_CLIENT_SECRET=$3cr3t


# The client ID of an application that sends requests, upstream, to the
# application identified by AZURE_CLIENT_ID. This downstream application should
# be a confidential client that can use the resource owner password credential
# grant type. This grant type is suitable for automated test runs where we need
# non-interactive user authentication.
# The upstream AZURE_CLIENT_ID application should be configured to use the
# "urn:ietf:params:oauth:grant-type:jwt-bearer" grant type. This allows
# it to receive a token from this downstream application, and exchange it for
# another token that allows database access. The token is requested using the
# On-Behalf-Of Flow:
# https://docs.azure.cn/en-us/entra/identity-platform/v2-oauth2-on-behalf-of-flow
AZURE_DOWNSTREAM_CLIENT_ID=aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa

# Client secret for the application identified by AZURE_DOWNSTREAM_CLIENT_ID.
# This is used to request a token using the resource owner password credential
# grant.
AZURE_DOWNSTREAM_CLIENT_SECRET=$3cr3t

# The username of a user account that can access the applications identified by
# AZURE_DOWNSTREAM_CLIENT_ID and AZURE_CLIENT_ID. The username is used to
# request a token with a resource owner password credential (ROPC) grant.
AZURE_DOWNSTREAM_USERNAME=end-user

# The password of the user account identified by AZURE_DOWNSTREAM_USERNAME. This is
# used to request a token with a resource owner password credential (ROPC)
# grant.
AZURE_DOWNSTREAM_PASSWORD=end-user-password

# Scope for accessing the application identified by AZURE_CLIENT_ID. This is
# used along with DOWNSTREAM_AZURE_USERNAME and DOWNSTREAM_AZURE_PASSWORD in a
# resource owner password credential (ROPC) grant when the application
# identified by DOWNSTREAM_CLIENT_ID requests a token authorizing it to access
# the application identified by AZURE_CLIENT_ID.
AZURE_DOWNSTREAM_SCOPE=https://tenant.host.com/bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb/.default

# Authorization end point of an OCI tenant which issues database access token.
OCI_TOKEN_URI=https://idcs-{TENANT_ID}.identity.oraclecloud.com/oauth2/v1/token

# The client ID of an OCI application
OCI_CLIENT_ID=aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee

# The client secret of an OCI application
OCI_CLIENT_SECRET=$3cr3t

# The scope of a token authorizing access to Oracle Database
OCI_SCOPE=primary_audience/scope

# The client ID of an application that sends requests, upstream, to the
# application identified by OCI_CLIENT_ID. This downstream application should be
# a confidential client that can use the resource owner password credential
# grant type, which is suitable for automated, non-interactive, test runs.
# The upstream OCI_CLIENT_ID application should be configured to use the
# "urn:ietf:params:oauth:grant-type:token-exchange" grant type. This allows
# it to receive a token from this downstream application, and exchange it for
# another token that allows database access.
# The token-exchange grant requires an identity propagation trust to be setup,
# which is described here:
# https://docs.oracle.com/en-us/iaas/Content/Identity/api-getstarted/token_exchange_grant_type_oauth.htm
OCI_DOWNSTREAM_CLIENT_ID=0123456789abcdefghijklmnopqrstuv

# Client secret for the application identified by OCI_DOWNSTREAM_CLIENT_ID. This
# is used to request a token using the resource owner password credential
# grant.
OCI_DOWNSTREAM_CLIENT_SECRET=$3cr3t

# The username of a user account that can access the applications identified by
# OCI_DOWNSTREAM_CLIENT_ID and OCI_CLIENT_ID. The username is used to request a
# token with a resource owner password credential (ROPC) grant.
OCI_DOWNSTREAM_USERNAME=end-user

# The password of the user account identified by OCI_DOWNSTREAM_USERNAME. This is
# used to request a token with a resource owner password credential (ROPC)
# grant.
OCI_DOWNSTREAM_PASSWORD=end-user-password

# Scope that identifies the application identified by OCI_CLIENT_ID.
OCI_DOWNSTREAM_SCOPE=upstream-app.scope